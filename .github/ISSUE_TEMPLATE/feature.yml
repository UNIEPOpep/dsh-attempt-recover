name: Feature request
description: 建议增加一个新功能或改动
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这个插件目前的功能：把 Harness 已生成但丢弃的输出显示出来，并让人决定是否加回。
        

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的具体问题
      description: 描述场景，不要直接给方案。
      placeholder: "例如：一个轮次里失败的 attempt 很多时，块堆在一起分不清哪条是最后一次尝试。"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么做
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 包括「不改插件也能绕过」的办法，如果有的话。
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个需求仍然属于「显示已生成但被丢弃的输出」这件事
          required: false
        - label: 我理解插件不会自动重试、也不会自动把内容加回上下文
          required: true
